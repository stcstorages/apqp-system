name: Supabase Keep Alive

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow running manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          # Replace with your actual Vercel URL
          curl -I https://apqp-system.vercel.app/api/keep-alive
